services:
  beles:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PUBLIC_URL: https://belesbrands.com.ua
      COOKIE_SECURE: "true"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_CA_PEM: ${DATABASE_CA_PEM:-}
      PG_POOL_MAX: "5"
      PDF_OPTIMIZE: "true"
      UPLOAD_CONCURRENCY: "1"
      MEDIA_BUDGET_BYTES: "1000000000"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      COOPERATION_APPROVED: ${COOPERATION_APPROVED:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
